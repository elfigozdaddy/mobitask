<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobitask - Task & Mobilità</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
        .custom-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); }
        .card-hover { transition: all 0.2s ease-in-out; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 15px 30px -5px rgba(14, 116, 144, 0.1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .ico { display: inline-block; vertical-align: middle; flex-shrink: 0; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-gradient-to-r from-cyan-600 to-blue-600 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-5 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white/20 p-2.5 rounded-2xl backdrop-blur-sm">
                    <i data-i="route" data-c="w-7 h-7 text-white"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">Mobitask</h1>
                    <p class="text-xs text-cyan-100 font-medium">Gestione intelligente task e mobilità</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <span id="task-counter" class="text-xs bg-white/10 px-3 py-1.5 rounded-full font-medium backdrop-blur-sm">0 task attivi</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-6 flex flex-col">

        <!-- Tabs -->
        <div id="tabs-bar" class="flex items-center space-x-2 overflow-x-auto pb-3 mb-3 no-scrollbar"></div>

        <!-- Filtro categorie del tab attivo -->
        <div id="category-filter" class="flex flex-wrap gap-2 mb-5"></div>

        <!-- Lista task -->
        <div id="tasks-container" class="space-y-4 mb-6"></div>

        <!-- Pulsante nuovo task -->
        <div class="mt-auto pt-4 pb-12 flex justify-center">
            <button type="button" onclick="openModal()" class="group relative inline-flex items-center justify-center p-0.5 mb-2 overflow-hidden text-sm font-medium rounded-full bg-gradient-to-br from-cyan-600 to-blue-600 text-white shadow-lg hover:shadow-cyan-500/25 transition-all duration-300">
                <span class="relative px-6 py-3.5 transition-all ease-in duration-75 bg-transparent rounded-full flex items-center space-x-2">
                    <i data-i="plus" data-c="w-5 h-5 group-hover:rotate-90 transition-transform duration-300"></i>
                    <span class="font-semibold text-base">Aggiungi Nuovo Task</span>
                </span>
            </button>
        </div>
    </main>

    <!-- Modal task -->
    <div id="task-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 custom-shadow transform transition-all scale-95 opacity-0" id="modal-content">
            <div class="flex justify-between items-center mb-5">
                <h3 id="modal-title" class="text-xl font-bold text-slate-800">Nuovo Task</h3>
                <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-2 rounded-xl hover:bg-slate-100 transition-colors">
                    <i data-i="x" data-c="w-5 h-5"></i>
                </button>
            </div>

            <div id="task-form">
                <input type="hidden" id="task-id">

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Evento / Titolo</label>
                        <input type="text" id="task-title" placeholder="Es. Tagliando auto o Riunione logistica..." onkeydown="if(event.key==='Enter'){event.preventDefault();saveTask();}"
                            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:bg-white text-sm transition-all">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Categoria <span class="normal-case font-normal text-slate-400">(facoltativa)</span></label>
                        <input type="text" id="task-category" list="category-suggestions" maxlength="30" autocomplete="off" placeholder="Scrivi una categoria o sceglila dai suggerimenti" onkeydown="if(event.key==='Enter'){event.preventDefault();saveTask();}"
                            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:bg-white text-sm transition-all">
                        <datalist id="category-suggestions"></datalist>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Descrizione</label>
                        <textarea id="task-desc" rows="3" placeholder="Dettagli, orari, luogo o note importanti..."
                            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:bg-white text-sm transition-all resize-none"></textarea>
                    </div>
                </div>

                <div class="mt-6 flex space-x-3">
                    <button type="button" onclick="closeModal()" class="flex-1 px-4 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-2xl transition-colors text-sm">
                        Annulla
                    </button>
                    <button type="button" onclick="saveTask()" class="flex-1 px-4 py-3 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-700 hover:to-blue-700 text-white font-semibold rounded-2xl transition-all shadow-md text-sm">
                        Salva Task
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal conferma -->
    <div id="confirm-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[60] flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 custom-shadow">
            <p id="confirm-text" class="text-sm text-slate-700 mb-6"></p>
            <div class="flex space-x-3">
                <button type="button" onclick="closeConfirm()" class="flex-1 px-4 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-2xl transition-colors text-sm">Annulla</button>
                <button type="button" id="confirm-yes" class="flex-1 px-4 py-3 bg-rose-600 hover:bg-rose-700 text-white font-semibold rounded-2xl transition-colors text-sm">Elimina</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center space-x-3 text-sm">
        <i data-i="circle-check" data-c="w-4 h-4 text-cyan-400"></i>
        <span id="toast-message">Operazione completata</span>
    </div>

    <script>
        // ---------- Icone SVG integrate (nessuna dipendenza esterna) ----------
        const ICONS = {
            'route': '<circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/>',
            'plus': '<path d="M5 12h14"/><path d="M12 5v14"/>',
            'x': '<path d="M18 6 6 18"/><path d="M6 6l12 12"/>',
            'pen': '<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/>',
            'trash': '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
            'check': '<path d="M20 6 9 17l-5-5"/>',
            'tag': '<path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><path d="M7.5 7.5h.01"/>',
            'clipboard': '<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/>',
            'circle-check': '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>'
        };

        function icon(name, cls) {
            return `<svg class="ico ${cls || ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;
        }

        function hydrateIcons() {
            document.querySelectorAll('i[data-i]').forEach(el => {
                el.outerHTML = icon(el.dataset.i, el.dataset.c);
            });
        }

        // ---------- Archiviazione (con fallback in memoria se il browser la blocca) ----------
        function loadJSON(key) {
            try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
        }

        function persist() {
            try {
                localStorage.setItem('mobitask_tabs', JSON.stringify(tabs));
                localStorage.setItem('mobitask_list', JSON.stringify(tasks));
            } catch (e) { /* archiviazione non disponibile: i dati restano in memoria */ }
        }

        // ---------- Stato ----------
        let tabs = loadJSON('mobitask_tabs');
        if (!Array.isArray(tabs) || tabs.length === 0) {
            tabs = [{ id: 'tab_' + Date.now(), name: 'I miei impegni' }];
        }

        let tasks = loadJSON('mobitask_list');
        if (!Array.isArray(tasks)) tasks = [];

        // Migrazione dalla vecchia versione (categorie fisse, nessun tabId)
        const legacyCategories = { mobilita: 'Mobilità', lavoro: 'Lavoro', personale: 'Personale' };
        tasks = tasks.map(t => ({
            ...t,
            tabId: t.tabId || tabs[0].id,
            category: legacyCategories[t.category] || t.category || ''
        }));

        let currentTab = tabs[0].id;
        let currentFilter = null;
        let editingTab = null;

        window.addEventListener('DOMContentLoaded', () => {
            hydrateIcons();
            persist();
            renderAll();
        });

        function renderAll() {
            renderTabs();
            renderFilter();
            renderTasks();
        }

        // ---------- Tab ----------
        function renderTabs() {
            const bar = document.getElementById('tabs-bar');
            bar.innerHTML = '';

            tabs.forEach(tab => {
                const active = tab.id === currentTab;
                const wrap = document.createElement('div');
                wrap.className = `flex items-center rounded-xl text-sm font-semibold transition-all shrink-0 ${
                    active ? 'bg-cyan-600 text-white shadow-sm' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'}`;

                if (editingTab === tab.id) {
                    wrap.innerHTML = `
                        <input id="tab-input" type="text" maxlength="24" value="${escapeHtml(tab.name)}"
                            onkeydown="tabInputKey(event, '${tab.id}')" onblur="commitRename('${tab.id}')"
                            class="mx-1.5 my-1 px-3 py-1.5 w-40 rounded-lg bg-white text-slate-800 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-cyan-300">`;
                } else {
                    wrap.innerHTML = `
                        <button type="button" onclick="switchTab('${tab.id}')" ${active ? `ondblclick="startRename('${tab.id}')"` : ''} class="px-5 py-2.5 ${active ? 'pr-2' : ''}">${escapeHtml(tab.name)}</button>
                        ${active ? `
                            <button type="button" onclick="startRename('${tab.id}')" title="Rinomina tab" class="p-2 text-white/80 hover:text-white hover:bg-white/20 rounded-lg transition-colors ${tabs.length > 1 ? '' : 'mr-1'}">
                                ${icon('pen', 'w-3.5 h-3.5')}
                            </button>
                            ${tabs.length > 1 ? `
                            <button type="button" onclick="deleteTab('${tab.id}')" title="Elimina tab" class="p-2 mr-1 text-white/80 hover:text-white hover:bg-white/20 rounded-lg transition-colors">
                                ${icon('trash', 'w-3.5 h-3.5')}
                            </button>` : ''}
                        ` : ''}`;
                }
                bar.appendChild(wrap);
            });

            const add = document.createElement('button');
            add.type = 'button';
            add.onclick = addTab;
            add.title = 'Aggiungi tab';
            add.className = 'w-10 h-10 rounded-xl bg-white border border-dashed border-slate-300 text-slate-500 hover:text-cyan-600 hover:border-cyan-400 hover:bg-cyan-50 transition-colors flex items-center justify-center shrink-0';
            add.innerHTML = icon('plus', 'w-4 h-4');
            bar.appendChild(add);

            if (editingTab) {
                setTimeout(() => {
                    const input = document.getElementById('tab-input');
                    if (input) { input.focus(); input.select(); }
                }, 0);
            }
        }

        function switchTab(id) {
            currentTab = id;
            currentFilter = null;
            editingTab = null;
            renderAll();
        }

        function addTab() {
            const tab = { id: 'tab_' + Date.now(), name: 'Nuovo tab' };
            tabs.push(tab);
            currentTab = tab.id;
            currentFilter = null;
            editingTab = tab.id;
            persist();
            renderAll();
            document.getElementById('tabs-bar').scrollTo({ left: 99999, behavior: 'smooth' });
        }

        function startRename(id) {
            editingTab = id;
            renderTabs();
        }

        function tabInputKey(e, id) {
            if (e.key === 'Enter') {
                e.preventDefault();
                e.target.blur();
            } else if (e.key === 'Escape') {
                editingTab = null;
                renderTabs();
            }
        }

        function commitRename(id) {
            if (editingTab !== id) return;
            const input = document.getElementById('tab-input');
            const name = input ? input.value.trim() : '';
            if (name) {
                tabs = tabs.map(t => t.id === id ? { ...t, name } : t);
                persist();
            }
            editingTab = null;
            renderTabs();
        }

        function deleteTab(id) {
            const tab = tabs.find(t => t.id === id);
            const count = tasks.filter(t => t.tabId === id).length;
            const msg = count > 0
                ? `Eliminare il tab "${tab.name}" e i suoi ${count} task?`
                : `Eliminare il tab "${tab.name}"?`;
            askConfirm(msg, () => {
                const index = tabs.findIndex(t => t.id === id);
                tabs = tabs.filter(t => t.id !== id);
                tasks = tasks.filter(t => t.tabId !== id);
                currentTab = tabs[Math.max(0, index - 1)].id;
                currentFilter = null;
                persist();
                renderAll();
                showToast('Tab eliminato');
            });
        }

        // ---------- Conferma ----------
        function askConfirm(message, onYes) {
            document.getElementById('confirm-text').innerText = message;
            document.getElementById('confirm-yes').onclick = () => { closeConfirm(); onYes(); };
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        function closeConfirm() {
            document.getElementById('confirm-modal').classList.add('hidden');
        }

        // ---------- Categorie ----------
        const categoryPalette = [
            'bg-cyan-50 text-cyan-700 border-cyan-100',
            'bg-blue-50 text-blue-700 border-blue-100',
            'bg-indigo-50 text-indigo-700 border-indigo-100',
            'bg-emerald-50 text-emerald-700 border-emerald-100',
            'bg-amber-50 text-amber-700 border-amber-100',
            'bg-rose-50 text-rose-700 border-rose-100',
            'bg-violet-50 text-violet-700 border-violet-100',
            'bg-teal-50 text-teal-700 border-teal-100'
        ];

        function categoryColor(name) {
            let h = 0;
            const s = name.toLowerCase();
            for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
            return categoryPalette[h % categoryPalette.length];
        }

        function tabCategories(tabId) {
            const seen = new Map();
            tasks.filter(t => t.tabId === tabId && t.category).forEach(t => {
                const key = t.category.toLowerCase();
                if (!seen.has(key)) seen.set(key, t.category);
            });
            return [...seen.values()].sort((a, b) => a.localeCompare(b, 'it'));
        }

        function renderFilter() {
            const box = document.getElementById('category-filter');
            const cats = tabCategories(currentTab);
            if (currentFilter && !cats.some(c => c.toLowerCase() === currentFilter.toLowerCase())) currentFilter = null;

            if (cats.length === 0) { box.innerHTML = ''; return; }

            box.innerHTML = '';
            const makeChip = (label, value, active) => {
                const b = document.createElement('button');
                b.type = 'button';
                b.textContent = label;
                b.onclick = () => setFilter(value);
                b.className = `text-xs font-medium px-3 py-1.5 rounded-full border transition-colors ${
                    active ? 'bg-slate-800 text-white border-slate-800' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-100'}`;
                box.appendChild(b);
            };
            makeChip('Tutte', null, currentFilter === null);
            cats.forEach(c => makeChip(c, c, currentFilter !== null && currentFilter.toLowerCase() === c.toLowerCase()));
        }

        function setFilter(value) {
            currentFilter = value;
            renderFilter();
            renderTasks();
        }

        // ---------- Lista task ----------
        function renderTasks() {
            const container = document.getElementById('tasks-container');
            container.innerHTML = '';

            const activeCount = tasks.filter(t => !t.completed).length;
            document.getElementById('task-counter').innerText = `${activeCount} task attivi`;

            let list = tasks.filter(t => t.tabId === currentTab);
            if (currentFilter) list = list.filter(t => (t.category || '').toLowerCase() === currentFilter.toLowerCase());
            list = [...list.filter(t => !t.completed), ...list.filter(t => t.completed)];

            if (list.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 bg-white rounded-3xl border border-dashed border-slate-200 p-8">
                        <div class="w-16 h-16 bg-cyan-50 text-cyan-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
                            ${icon('clipboard', 'w-8 h-8')}
                        </div>
                        <h3 class="text-base font-semibold text-slate-700">Nessun task in questa sezione</h3>
                        <p class="text-xs text-slate-400 mt-1">Usa il pulsante sottostante per crearne uno nuovo.</p>
                    </div>`;
                return;
            }

            list.forEach(task => {
                const card = document.createElement('div');
                card.className = `bg-white rounded-3xl p-5 border border-slate-100 custom-shadow card-hover flex items-start space-x-4 ${task.completed ? 'opacity-60 bg-slate-50/50' : ''}`;

                const badge = task.category ? `
                    <span class="text-[11px] font-medium px-2.5 py-1 rounded-full border ${categoryColor(task.category)} flex items-center space-x-1 shrink-0 ml-2">
                        ${icon('tag', 'w-3 h-3')}
                        <span>${escapeHtml(task.category)}</span>
                    </span>` : '';

                card.innerHTML = `
                    <button type="button" onclick="toggleTask(${task.id})" class="mt-1 w-6 h-6 rounded-full border-2 ${task.completed ? 'bg-cyan-600 border-cyan-600 text-white' : 'border-slate-300 hover:border-cyan-500'} flex items-center justify-center transition-colors shrink-0">
                        ${task.completed ? icon('check', 'w-3.5 h-3.5') : ''}
                    </button>
                    <div class="flex-grow min-w-0">
                        <div class="flex items-center justify-between mb-1">
                            <h2 class="text-base font-semibold text-slate-800 truncate ${task.completed ? 'line-through text-slate-400' : ''}">${escapeHtml(task.title)}</h2>
                            ${badge}
                        </div>
                        <p class="text-xs text-slate-500 leading-relaxed ${task.completed ? 'line-through text-slate-400' : ''}">${escapeHtml(task.desc || 'Nessuna descrizione specificata.')}</p>
                    </div>
                    <div class="flex items-center space-x-1 shrink-0 ml-2">
                        <button type="button" onclick="editTask(${task.id})" class="p-2 text-slate-400 hover:text-cyan-600 hover:bg-cyan-50 rounded-xl transition-colors" title="Modifica">
                            ${icon('pen', 'w-3.5 h-3.5')}
                        </button>
                        <button type="button" onclick="deleteTask(${task.id})" class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition-colors" title="Elimina">
                            ${icon('trash', 'w-3.5 h-3.5')}
                        </button>
                    </div>`;
                container.appendChild(card);
            });
        }

        // ---------- Modale task ----------
        function openModal(id = null) {
            const modal = document.getElementById('task-modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);

            document.getElementById('category-suggestions').innerHTML =
                tabCategories(currentTab).map(c => `<option value="${escapeHtml(c)}"></option>`).join('');

            const idEl = document.getElementById('task-id');
            const titleEl = document.getElementById('task-title');
            const catEl = document.getElementById('task-category');
            const descEl = document.getElementById('task-desc');

            if (id) {
                document.getElementById('modal-title').innerText = 'Modifica Task';
                const task = tasks.find(t => t.id === id);
                if (task) {
                    idEl.value = task.id;
                    titleEl.value = task.title;
                    catEl.value = task.category || '';
                    descEl.value = task.desc || '';
                }
            } else {
                document.getElementById('modal-title').innerText = 'Nuovo Task';
                idEl.value = '';
                titleEl.value = '';
                catEl.value = currentFilter || '';
                descEl.value = '';
            }
            setTimeout(() => titleEl.focus(), 50);
        }

        function closeModal() {
            const modal = document.getElementById('task-modal');
            const content = document.getElementById('modal-content');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 200);
        }

        function saveTask() {
            const id = document.getElementById('task-id').value;
            const title = document.getElementById('task-title').value.trim();
            const category = document.getElementById('task-category').value.trim();
            const desc = document.getElementById('task-desc').value;

            if (!title) {
                document.getElementById('task-title').focus();
                showToast('Inserisci un titolo');
                return;
            }

            if (id) {
                tasks = tasks.map(t => String(t.id) === id ? { ...t, title, category, desc } : t);
                showToast('Task aggiornato con successo');
            } else {
                tasks.unshift({ id: Date.now(), tabId: currentTab, title, category, desc, completed: false });
                showToast('Nuovo task creato');
            }

            persist();
            renderAll();
            closeModal();
        }

        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            persist();
            renderAll();
        }

        function editTask(id) { openModal(id); }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            persist();
            renderAll();
            showToast('Task eliminato');
        }

        // ---------- Utility ----------
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
